<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вехи</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191820'/%3E%3Cpath d='M7 22c5 0 6-12 11-12h7' stroke='%23b8a4ff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='22' r='3' fill='%235fd6a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="auth" class="auth" hidden>
  <form id="authForm" class="auth-box" autocomplete="on">
    <div class="brand"><span class="brand-mark"></span>Вехи</div>
    <h1 id="authTitle">Вход в команду</h1>
    <p id="authHint" class="muted"></p>
    <label id="nameRow" hidden>Имя<input id="fName" name="name" autocomplete="name"></label>
    <label>Email<input id="fEmail" name="email" type="email" autocomplete="email" required></label>
    <label>Пароль<input id="fPass" name="password" type="password" autocomplete="current-password" required minlength="8"></label>
    <label id="inviteRow" hidden>Код приглашения<input id="fInvite" name="invite" autocomplete="off"></label>
    <div id="authErr" class="err" role="alert"></div>
    <button class="btn primary" id="authSubmit" type="submit">Войти</button>
    <button class="link" id="authSwitch" type="button">У меня есть приглашение</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Поиск по картам и этапам"></div>
    <div class="sect-head"><span>Дорожные карты</span><button class="icon-btn" id="newMap" title="Новая карта"><svg class="i"><use href="#i-plus"/></svg></button></div>
    <ul id="maps" class="maps"></ul>
    <div class="sect-head" id="stagesHead"><span>Этапы карты</span></div>
    <div class="seg" id="filter">
      <button data-f="all" class="on">Все</button><button data-f="active">Активные</button><button data-f="done">Готовые</button>
    </div>
    <ul id="stages" class="stages"></ul>
    <div class="me">
      <span class="avatar" id="meAvatar"></span>
      <div class="me-txt"><b id="meName"></b><small id="meSub"></small></div>
      <button class="icon-btn" id="openSettings" title="Команда и настройки"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn" id="toggleSide" title="Скрыть панель"><svg class="i"><use href="#i-side"/></svg></button>
      <nav class="crumbs"><span>Дорожные карты</span><svg class="i sm"><use href="#i-chev"/></svg><b id="mapName" title="Двойной щелчок, чтобы переименовать"></b></nav>
      <span class="ring-wrap" id="topProgress"></span>
      <span class="spacer"></span>
      <div class="peers" id="peers"></div>
      <span class="ro-badge" id="roBadge" hidden>Только просмотр</span>
      <button class="btn ghost" id="importBtn"><svg class="i"><use href="#i-import"/></svg>Импорт</button>
      <div class="menu-wrap">
        <button class="btn primary" id="exportBtn"><svg class="i"><use href="#i-export"/></svg>Экспорт</button>
        <div class="menu" id="exportMenu" hidden>
          <button data-x="json">Скачать JSON</button>
          <button data-x="md">Скачать Markdown</button>
          <button data-x="png">Скачать PNG</button>
          <button data-x="copy">Скопировать JSON</button>
        </div>
      </div>
    </header>

    <div id="stage" class="stage">
      <div id="world" class="world">
        <svg id="edges" class="layer"></svg>
        <svg id="shapes" class="layer"></svg>
        <div id="labels"></div>
        <div id="cards"></div>
        <svg id="overlay" class="layer"></svg>
        <div id="cursors"></div>
      </div>

      <div class="toolbar" id="toolbar">
        <button data-tool="hand" title="Рука (H или пробел)"><svg class="i"><use href="#i-hand"/></svg></button>
        <button data-tool="select" title="Выбор" class="on"><svg class="i"><use href="#i-pointer"/></svg><sub>1</sub></button>
        <span class="tb-sep"></span>
        <button data-tool="rect" title="Прямоугольник"><svg class="i"><use href="#i-rect"/></svg><sub>2</sub></button>
        <button data-tool="diamond" title="Ромб"><svg class="i"><use href="#i-diamond"/></svg><sub>3</sub></button>
        <button data-tool="ellipse" title="Эллипс"><svg class="i"><use href="#i-ellipse"/></svg><sub>4</sub></button>
        <button data-tool="arrow" title="Стрелка: тяните от этапа к этапу, чтобы связать"><svg class="i"><use href="#i-arrow"/></svg><sub>5</sub></button>
        <button data-tool="pen" title="Карандаш"><svg class="i"><use href="#i-pen"/></svg><sub>6</sub></button>
        <button data-tool="text" title="Текст"><svg class="i"><use href="#i-text"/></svg><sub>7</sub></button>
        <button data-tool="image" title="Картинка"><svg class="i"><use href="#i-image"/></svg><sub>8</sub></button>
        <button data-tool="eraser" title="Ластик"><svg class="i"><use href="#i-eraser"/></svg><sub>9</sub></button>
        <span class="tb-sep"></span>
        <button data-tool="card" title="Новый этап: щёлкните по холсту"><svg class="i"><use href="#i-card"/></svg><sub>0</sub></button>
      </div>

      <div class="zoom">
        <button class="icon-btn" id="zOut" title="Отдалить"><svg class="i"><use href="#i-minus"/></svg></button>
        <button class="zval" id="zVal" title="Сбросить до 100%">100%</button>
        <button class="icon-btn" id="zIn" title="Приблизить"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="zFit" title="Показать всю карту"><svg class="i"><use href="#i-fit"/></svg></button>
        <span class="tb-sep"></span>
        <button class="icon-btn" id="undo" title="Отменить (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="redo" title="Повторить (Ctrl+Shift+Z)"><svg class="i"><use href="#i-redo"/></svg></button>
      </div>

      <div class="minimap" id="minimapWrap">
        <div class="mm-head"><svg class="i sm"><use href="#i-map"/></svg>Обзор<button class="icon-btn sm" id="mmToggle"><svg class="i sm"><use href="#i-chevdown"/></svg></button></div>
        <canvas id="minimap" width="220" height="130"></canvas>
      </div>

      <div class="pop" id="pop" hidden></div>
      <div class="empty" id="empty" hidden></div>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="imgInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-chevdown" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevup" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v5h14v-5"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 14v5h14v-5"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6.5V5a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4.3 15a1.6 1.6 0 0 1 2.4-2.1L8 14"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M5 3.5 18.5 10l-6 1.8-2.6 6.2z"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/></symbol>
    <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5zM13.5 7l3 3"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m8.5 19.5-4-4a1.5 1.5 0 0 1 0-2.1l8.9-8.9a1.5 1.5 0 0 1 2.1 0l4 4a1.5 1.5 0 0 1 0 2.1l-8 8.9zM8.5 19.5H20M9 9l6 6"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7 9.5h7M7 13h10M7 16h5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z M9 4.5v13M15 6.5v13"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4.5M5.5 5h11l-2.5 4 2.5 4h-11"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18" r="1.3"/></symbol>
    <symbol id="i-sub" viewBox="0 0 24 24"><path d="M6 5v8a3 3 0 0 0 3 3h9M15 13l3 3-3 3"/></symbol>
    <symbol id="i-dash" viewBox="0 0 24 24"><path d="M3 12h4M10 12h4M17 12h4"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M3 12h18"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.4"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
  </defs>
</svg>
<script src="/app.js" type="module"></script>
</body>
</html>
